<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Python Serverless Chat Room</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-950 text-slate-100 h-[100dvh] flex flex-col justify-between overflow-hidden">
    
    <!-- Header / Navbar -->
    <header class="bg-slate-900/80 backdrop-blur border-b border-slate-800 px-4 py-3 flex justify-between items-center shrink-0">
        <div class="flex items-center space-x-2">
            <div class="w-3 h-3 bg-emerald-500 rounded-full animate-pulse"></div>
            <h1 class="font-bold text-sm sm:text-base text-blue-400">Python Chat Room</h1>
        </div>
        <span id="status" class="text-xs bg-slate-800 text-slate-300 px-2.5 py-1 rounded-full border border-slate-700">Vercel Edge</span>
    </header>

    <!-- Chat Messages Container -->
    <main id="chat-box" class="flex-1 overflow-y-auto p-4 space-y-3 flex flex-col">
        <!-- Dynamic chat messages populate here -->
    </main>

    <!-- Input Form Footer -->
    <footer class="bg-slate-900 border-t border-slate-800 p-3 sm:p-4 shrink-0">
        <form id="chat-form" class="flex flex-col sm:flex-row gap-2 max-w-4xl mx-auto">
            <input 
                type="text" 
                id="username" 
                placeholder="Your Name" 
                required 
                maxlength="20"
                class="bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-sm sm:w-1/4 focus:outline-none focus:border-blue-500 transition"
            >
            <div class="flex gap-2 flex-1">
                <input 
                    type="text" 
                    id="message" 
                    placeholder="Type your message..." 
                    required 
                    class="bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-sm flex-1 focus:outline-none focus:border-blue-500 transition"
                >
                <button 
                    type="submit" 
                    class="bg-blue-600 hover:bg-blue-500 active:scale-95 text-white px-5 py-2.5 rounded-xl text-sm font-medium transition shrink-0 cursor-pointer"
                >
                    Send
                </button>
            </div>
        </form>
    </footer>

    <script>
        const chatBox = document.getElementById('chat-box');
        const chatForm = document.getElementById('chat-form');
        const usernameInput = document.getElementById('username');
        const messageInput = document.getElementById('message');

        // Save username locally so user doesn't have to re-type it
        if(localStorage.getItem('chat_username')) {
            usernameInput.value = localStorage.getItem('chat_username');
        }

        usernameInput.addEventListener('input', (e) => {
            localStorage.setItem('chat_username', e.target.value);
        });

        async function fetchMessages() {
            try {
                const res = await fetch('/api/messages');
                const data = await res.json();
                
                // Preserve scroll position behavior
                const isScrolledToBottom = chatBox.scrollHeight - chatBox.clientHeight <= chatBox.scrollTop + 50;
                
                chatBox.innerHTML = '';
                
                if (data.messages.length === 0) {
                    chatBox.innerHTML = `<div class="m-auto text-center text-slate-500 text-sm">No messages yet. Start the conversation!</div>`;
                    return;
                }

                data.messages.forEach(msg => {
                    const isMe = msg.username === usernameInput.value;
                    const div = document.createElement('div');
                    div.className = `flex flex-col max-w-[85%] sm:max-w-[70%] ${isMe ? 'ml-auto items-end' : 'mr-auto items-start'}`;
                    
                    div.innerHTML = `
                        <span class="text-[10px] text-slate-400 mb-0.5 px-1">${escapeHtml(msg.username)}</span>
                        <div class="p-3 rounded-2xl text-sm break-words ${isMe ? 'bg-blue-600 text-white rounded-br-xs' : 'bg-slate-900 border border-slate-800 text-slate-200 rounded-bl-xs'}">
                            ${escapeHtml(msg.message)}
                        </div>
                    `;
                    chatBox.appendChild(div);
                });

                if (isScrolledToBottom || data.messages.length <= 3) {
                    chatBox.scrollTop = chatBox.scrollHeight;
                }
            } catch (e) {
                console.error("Failed to sync messages", e);
            }
        }

        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = usernameInput.value.trim();
            const message = messageInput.value.trim();
            if (!username || !message) return;

            messageInput.value = '';

            try {
                await fetch('/api/send', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, message })
                });
                fetchMessages();
            } catch (err) {
                console.error("Failed to send message", err);
            }
        });

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        // Poll interval for serverless setup
        setInterval(fetchMessages, 3000);
        fetchMessages();
    </script>
</body>
</html>
