<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Python Chat - MongoDB User Auth</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f9; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .card { width: 100%; max-width: 400px; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); box-sizing: border-box; }
        .hidden { display: none !important; }
        #chat-container { max-width: 600px; }
        #chat-box { height: 300px; border: 1px solid #ddd; border-radius: 4px; overflow-y: scroll; padding: 10px; margin-bottom: 10px; background: #fafafa; }
        .input-group { margin-bottom: 15px; }
        input, button { padding: 10px; font-size: 14px; border: 1px solid #ddd; border-radius: 4px; width: 100%; box-sizing: border-box; }
        button { background: #0070f3; color: white; border: none; cursor: pointer; }
        button:hover { background: #0051a2; }
        .chat-row { display: flex; gap: 10px; }
        .chat-row input { flex: 1; }
        .chat-row button { width: auto; }
    </style>
</head>
<body>

    <!-- Login Screen -->
    <div id="login-screen" class="card">
        <h2>Database Login</h2>
        <p style="color: #666; font-size: 14px;">Enter a unique handle to register or sign in.</p>
        <div class="input-group">
            <input type="text" id="username-input" placeholder="Username..." />
        </div>
        <button onclick="loginUser()">Continue to Chat</button>
    </div>

    <!-- Chat Room Screen -->
    <div id="chat-container" class="card hidden" style="max-width: 600px;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
            <h2 style="margin: 0;">Python Chat Room</h2>
            <span id="display-user" style="font-size: 13px; color: #666; background: #eee; padding: 4px 8px; border-radius: 4px;"></span>
        </div>
        <div id="chat-box"></div>
        <div class="chat-row">
            <input type="text" id="message-input" placeholder="Type a message..." onkeypress="handleKeyPress(event)" />
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script>
        let currentUser = "";

        async function loginUser() {
            const inputVal = document.getElementById('username-input').value.trim();
            if (!inputVal) {
                alert("Please enter a username.");
                return;
            }

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: inputVal })
                });
                
                const data = await res.json();
                if (res.ok) {
                    currentUser = data.username;
                    document.getElementById('display-user').innerText = `User: ${currentUser}`;

                    document.getElementById('login-screen').classList.add('hidden');
                    document.getElementById('chat-container').classList.remove('hidden');

                    fetchMessages();
                    setInterval(fetchMessages, 3000);
                } else {
                    alert(data.detail || "Login failed");
                }
            } catch (err) {
                console.error("Login network error:", err);
            }
        }

        async function fetchMessages() {
            try {
                const res = await fetch('/api/messages');
                const data = await res.json();
                const chatBox = document.getElementById('chat-box');
                chatBox.innerHTML = data.messages.map(m => `<div><b>${m.user}:</b> ${m.text}</div>`).join('');
                chatBox.scrollTop = chatBox.scrollHeight;
            } catch (err) {
                console.error("Error fetching messages:", err);
            }
        }

        async function sendMessage() {
            const textInput = document.getElementById('message-input');
            const text = textInput.value;
            if (!text.trim()) return;

            await fetch('/api/messages', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ user: currentUser, text })
            });

            textInput.value = '';
            fetchMessages();
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        }
    </script>
</body>
</html>
